---

- name: Ensure the ssl certs dir exists
  file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
    state: directory
    owner: root
  with_items:
    - {
        path: "{{ haproxy_ssl_path }}",
        mode: '0750'
    }
    - {
        path: "{{ haproxy_key_path }}",
        mode: '0750'
    }

# Generate keys for use with LUA scripts
#openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out account.key
#openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out example.net.key

# Debian 12 (bookworm) and later mark the system python as externally
# managed (PEP 668), so pip cannot install into it - use the distro packages.
- name: Set python install method
  set_fact:
    python_externally_managed: "{{ ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int >= 12 }}"

- name: Ensure PIP is installed.
  ansible.builtin.apt:
    name: python-pip
    state: present
  when: ansible_python.version.major==2 and not python_externally_managed | bool

- name: Ensure PIP is installed.
  ansible.builtin.apt:
    name: python3-pip
    state: present
  when: ansible_python.version.major==3 and not python_externally_managed | bool

- name: Set python pip version
  set_fact:
    pip_executable: 'pip'
  when: ansible_python.version.major==2

- name: Set python pip version
  set_fact:
    pip_executable: 'pip3'
  when: ansible_python.version.major==3


- name: Ensure pip_install_packages are installed.
  pip:
    name: "{{ item.name | default(item) }}"
    version: "{{ item.version | default(omit) }}"
    virtualenv: "{{ item.virtualenv | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
    executable: "{{ pip_executable }}"
  loop: "{{ pip_install_packages }}"
  when: ansible_distribution == "Debian" and not python_externally_managed | bool

- name: Install required packages | Debian
  apt:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
  with_items: "{{ python_package_dependencies }}"
  become: true
  when: ansible_distribution == "Debian" and python_externally_managed | bool

- name: Generate an OpenSSL private key for the account
  community.crypto.openssl_privatekey:
    path: "{{ haproxy_key_path }}/{{ haproxy_lua_accountname }}.key"
    size: 4096
    mode: 0600

- name: Generate an OpenSSL private key for the domain
  community.crypto.openssl_privatekey:
    path: "{{ haproxy_key_path }}/{{ item }}.key"
    size: 2048
    mode: 0600
  with_items: haproxy_key_domains
